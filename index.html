<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salehin's Territory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --book-bg: #111827;
        --page-bg: #1f2937;
        --accent: #6366f1;
      }
      body {
        background-color: var(--book-bg);
        background-image: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.05) 0%, transparent 100%);
        scrollbar-width: thin;
        scrollbar-color: var(--accent) var(--book-bg);
      }
      .ebook-container {
        perspective: 1500px;
      }
      .page-shadow {
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5), inset 0 0 100px rgba(0,0,0,0.2);
      }
      .spine-gradient {
        background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.2) 48%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.2) 52%, rgba(0,0,0,0) 100%);
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'primary-accent': '#6366F1',
              'dark-bg': '#111827',
              'page-bg': '#1f2937',
            },
            fontFamily: {
              'sans': ['Inter', 'sans-serif'],
              'serif': ['Playfair Display', 'serif'],
            },
          },
        },
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",

    "react/": "https://esm.sh/react@^19.2.3/",
    "framer-motion": "https://esm.sh/framer-motion@^12.23.26",
    "react-icons/": "https://esm.sh/react-icons@^5.5.0/",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.89.0"
  }
}
</script>
</head>

    <div id="root"></div>

  </body>
</html>
